services:
  processr:
    build:
      context: .
      dockerfile: processr/Dockerfile
    environment:
      - TRAINR_ENDPOINT=http://trainr:7777
    ports:
      - "8888:8888"
    depends_on:
      - trainr

  trainr:
    build:
      context: .
      dockerfile: trainr/Dockerfile
    environment:
      - PREDICTR_ENDPOINT=http://predictr:9999
    ports:
      - "7777:7777"
    volumes:
      - models:/app/models
    depends_on:
      - predictr

  predictr:
    build:
      context: .
      dockerfile: predictr/Dockerfile
    ports:
      - "9999:9999"
    volumes:
      - models:/app/models

# named volume shared by trainr (writes the model) and predictr (reads it)
volumes:
  models:
