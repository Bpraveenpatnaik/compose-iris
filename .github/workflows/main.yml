name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r trainr/requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest --cov=common --cov=processr --cov=trainr --cov=predictr --cov-report=term-missing --cov-fail-under=90

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          for port in 8888 7777 9999; do
            timeout 60 bash -c "until curl -sf localhost:$port/ping; do sleep 2; done"
          done
      - name: Predict, then send feedback through the full pipeline
        run: |
          SAMPLE='"alcohol":13.2,"malic_acid":1.78,"ash":2.14,"alcalinity_of_ash":11.2,"magnesium":100,"total_phenols":2.65,"flavanoids":2.76,"nonflavanoid_phenols":0.26,"proanthocyanins":1.28,"color_intensity":4.38,"hue":1.05,"od280_od315_of_diluted_wines":3.4,"proline":1050'
          curl -sf localhost:9999/predict_wine -H 'content-type: application/json' -d "{$SAMPLE}" | tee /dev/stderr | grep -q "Cultivar 1"
          curl -sf localhost:8888/process -H 'content-type: application/json' -d "[{$SAMPLE,\"wine_class\":\"Cultivar 1\"}]"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
